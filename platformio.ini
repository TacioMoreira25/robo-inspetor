; =============================================================================
; CONFIGURAÇÃO DO PROJETO PLATFORMIO - ROBÔ INSPETOR TERRESTRE (UGV)
; =============================================================================
; ARQUITETURA DE COMPILAÇÃO UNIFICADA:
; O projeto concentra todo o código-fonte em "src/" e "include/".
; As diretivas de compilação (build_flags) selecionam automaticamente os módulos
; correspondentes a cada ambiente (Simulador Wokwi, ESP32 DevKit V1 Master ou
; ESP32-CAM Slave), evitando duplicação de arquivos.

[platformio]
default_envs = wokwi

; Configurações comuns a todas as placas (Framework Arduino e Biblioteca JSON)
[env]
platform = espressif32
framework = arduino
extra_scripts = pre:scripts/sync_html.py
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps =
    Wire
    bblanchon/ArduinoJson @ ^6.21.3

; -----------------------------------------------------------------------------
; 1. AMBIENTE DE SIMULAÇÃO (Apenas para rodar no Wokwi dentro do VS Code)
; -----------------------------------------------------------------------------
[env:wokwi]
board = esp32dev
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D MODO_SIMULACAO=1
    -D PLACA_ESP32_DEVKIT=1

; -----------------------------------------------------------------------------
; 2. AMBIENTE DA PLACA PRINCIPAL: ESP32 DevKit V1 (MASTER - Cérebro do Robô)
; Selecione este ambiente para gravar via USB a ESP32 DevKit V1.
; -----------------------------------------------------------------------------
[env:esp32_hardware]
board = esp32dev
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D MODO_SIMULACAO=0
    -D PLACA_ESP32_DEVKIT=1

; -----------------------------------------------------------------------------
; 3. AMBIENTE DA CÂMERA: ESP32-CAM (SLAVE - Dedicada 100% ao Vídeo Ao Vivo)
; Selecione este ambiente para gravar a ESP32-CAM (usando a DevKit em Modo Ponte).
; -----------------------------------------------------------------------------
[env:esp32cam_hardware]
board = esp32cam
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D MODO_SIMULACAO=0
    -D PLACA_ESP32_CAM=1

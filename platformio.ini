; PlatformIO Project Configuration File
; Robô Inspetor Terrestre (UGV) - Firmware Único com Arquitetura HAL

[platformio]
default_envs = wokwi

; Configurações base compartilhadas
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps =
    Wire
    bblanchon/ArduinoJson @ ^6.21.3

; Ambiente de Simulação no Wokwi Simulator
[env:wokwi]
board = esp32dev
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D MODO_SIMULACAO=1
    -D PLACA_ESP32_DEVKIT=1

; Ambiente de Gravação para ESP32 DevKit Física (Bancada)
[env:esp32_hardware]
board = esp32dev
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D MODO_SIMULACAO=0
    -D PLACA_ESP32_DEVKIT=1

; Ambiente de Gravação para ESP32-CAM Física (OV2640 DVP + I2C)
[env:esp32cam_hardware]
board = esp32cam
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D MODO_SIMULACAO=0
    -D PLACA_ESP32_CAM=1
